<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>React Hooks Playground</title>

  <!-- Code editor (CodeMirror) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" />

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    button { font: inherit; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: default; }

    .layout { display: flex; height: 100vh; }

    /* Sidebar */
    .sidebar { width: 180px; flex-shrink: 0; background: #1e293b; padding: 16px 0; overflow-y: auto; }
    .sidebar h1 { color: #fff; font-size: 17px; margin: 0 16px 16px; }
    .sidebar button {
      display: block; width: 100%; padding: 10px 16px;
      background: none; border: none; color: #cbd5e1; text-align: left; font-size: 15px;
    }
    .sidebar button:hover { background: #334155; }
    .sidebar button.active { background: #3b82f6; color: #fff; }

    /* Main area */
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 16px; background: #1e293b; border-bottom: 1px solid #334155;
    }
    .title { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .title strong { font-size: 17px; }
    .badge { background: #f59e0b; color: #1e293b; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
    .actions { display: flex; gap: 8px; flex-shrink: 0; }
    .primary, .secondary { border: none; border-radius: 6px; padding: 7px 14px; font-weight: 600; }
    .primary { background: #22c55e; color: #052e16; }
    .primary:hover { background: #4ade80; }
    .secondary { background: #475569; color: #fff; }
    .secondary:hover:not(:disabled) { background: #64748b; }

    .examples { display: flex; gap: 6px; padding: 8px 16px; background: #172033; border-bottom: 1px solid #334155; overflow-x: auto; }
    .example { display: flex; align-items: center; gap: 6px; white-space: nowrap; background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 6px; padding: 5px 12px; font-size: 13px; }
    .example:hover { background: #334155; }
    .example.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }
    .example-number { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); font-size: 11px; font-weight: 700; }
    .workspace { flex: 1; min-height: 0; display: flex; }
    .editor-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid #334155; }
    .tabs { display: flex; background: #1e293b; border-bottom: 1px solid #334155; overflow-x: auto; }
    .tab {
      background: none; border: none; border-bottom: 2px solid transparent;
      color: #94a3b8; padding: 7px 14px; font-family: ui-monospace, monospace; font-size: 13px; white-space: nowrap;
    }
    .tab:hover { color: #e2e8f0; }
    .tab.active { color: #fff; border-bottom-color: #3b82f6; background: #282a36; }
    .dot { color: #f59e0b; margin-left: 6px; }
    .editor-wrap { flex: 1; min-height: 0; position: relative; }
    .editor-host { position: absolute; inset: 0; }
    .editor-host .CodeMirror { height: 100%; font-size: 14px; }
    /* Debugger */
    .debug-on { background: #b45309; }
    .secondary.debug-on:hover:not(:disabled) { background: #d97706; }
    .cm-debug-line { background: rgba(250, 204, 21, 0.22) !important; box-shadow: inset 3px 0 0 #facc15; }
    .debug-tip {
      position: fixed; z-index: 10; pointer-events: none;
      background: #0b1220; color: #fde68a; border: 1px solid #facc15; border-radius: 4px;
      padding: 3px 8px; font-family: ui-monospace, monospace; font-size: 13px; white-space: pre;
    }
    .debug-panel { flex-shrink: 0; display: flex; flex-direction: column; border-top: 1px solid #334155; background: #0b1220; }
    .debug-resize { height: 6px; flex-shrink: 0; cursor: ns-resize; background: #334155; }
    .debug-resize:hover { background: #3b82f6; }
    body.resizing { cursor: ns-resize; user-select: none; }
    body.resizing iframe { pointer-events: none; }
    .debug-controls { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: #1e293b; flex-wrap: wrap; }
    .debug-controls .play { min-width: 76px; }
    .debug-controls .next { background: #2563eb; color: #fff; font-weight: 600; }
    .debug-controls .next:hover:not(:disabled) { background: #3b82f6; }
    .secondary.render-first { background: #16a34a; }
    .secondary.render-first:hover:not(:disabled) { background: #22c55e; }
    .debug-status { color: #94a3b8; font-size: 13px; margin-left: 6px; flex: 1; }
    .speed { background: #334155; color: #e2e8f0; border: none; border-radius: 4px; padding: 2px 6px; font-size: 12px; }
    .debug-vars { flex: 1; overflow-y: auto; padding: 6px 12px; font-family: ui-monospace, monospace; font-size: 13px; }
    .debug-var { padding: 2px 0; white-space: pre-wrap; word-break: break-word; }
    .var-name { color: #93c5fd; }
    .var-value { color: #fde68a; }
    .debug-empty { color: #64748b; }
    .debug-code { margin: 4px 0 6px; padding: 6px 8px; background: #1e293b; border-left: 3px solid #fbbf24; color: #e2e8f0; white-space: pre-wrap; font-size: 12px; }
    .debug-event { color: #fbbf24; }
    .ui-paused { color: #fbbf24; font-size: 12px; }
    .shadow-frame { position: absolute; width: 0; height: 0; border: 0; visibility: hidden; }
    .cm-locked { background: rgba(255, 255, 255, 0.05); cursor: not-allowed; }

    .right-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .pane-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 12px; background: #1e293b; color: #94a3b8; font-size: 13px;
      border-bottom: 1px solid #334155;
    }
    .preview { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .preview iframe { flex: 1; width: 100%; border: none; background: #fff; }

    /* Console */
    .console { height: 40%; display: flex; flex-direction: column; border-top: 1px solid #334155; }
    .console-body { flex: 1; overflow-y: auto; background: #0b1220; font-family: ui-monospace, monospace; font-size: 13px; }
    .log { margin: 0; padding: 4px 12px; border-bottom: 1px solid #1e293b; white-space: pre-wrap; word-break: break-word; }
    .log-warn { color: #fbbf24; background: #422006; }
    .log-error { color: #f87171; background: #450a0a; }
    .log-info { color: #93c5fd; }
    .console-actions { display: flex; align-items: center; gap: 12px; }
    .order-toggle { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
    .small { background: #334155; color: #e2e8f0; border: none; border-radius: 4px; padding: 2px 10px; font-size: 12px; }

    /* Mobile: sab upar-neeche */
    @media (max-width: 800px) {
      .layout { flex-direction: column; height: auto; }
      .sidebar { width: auto; display: flex; flex-wrap: wrap; align-items: center; padding: 8px; }
      .sidebar h1 { margin: 0 12px 0 8px; }
      .sidebar button { width: auto; border-radius: 6px; }
      .workspace { flex-direction: column; }
      .editor-pane { height: 50vh; flex: none; border-right: none; }
      .preview { height: 40vh; flex: none; }
      .console { height: 30vh; }
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.9/babel.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/jsx/jsx.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>

  <!-- Playground app (hooks ki list bhi isi file ke upar hai) -->
  <script type="text/babel" src="./playground.jsx"></script>

</body>
</html>
